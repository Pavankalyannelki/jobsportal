openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: CareerHub API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication
  - name: seeker
    description: Seeker-specific endpoints
  - name: company
    description: Company-specific endpoints
  - name: jobs
    description: Job listings
  - name: applications
    description: Job applications
  - name: stats
    description: Platform statistics

paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new account (seeker or company)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "400":
          description: Validation error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Logged in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Log out current user
      responses:
        "204":
          description: Logged out

  /auth/me:
    get:
      operationId: getMe
      tags: [auth]
      summary: Get current authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /seeker/profile:
    get:
      operationId: getSeekerProfile
      tags: [seeker]
      summary: Get seeker's own profile
      responses:
        "200":
          description: Seeker profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekerProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateSeekerProfile
      tags: [seeker]
      summary: Update seeker profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SeekerProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekerProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a seeker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /seeker/dashboard:
    get:
      operationId: getSeekerDashboard
      tags: [seeker]
      summary: Seeker dashboard summary stats and recent activity
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SeekerDashboard"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /seeker/applications:
    get:
      operationId: getSeekerApplications
      tags: [seeker]
      summary: List all applications submitted by this seeker
      parameters:
        - name: status
          in: query
          schema:
            type: string
            enum: [submitted, under_review, shortlisted, rejected, hired]
      responses:
        "200":
          description: List of applications
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationWithJob"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company/profile:
    get:
      operationId: getCompanyProfile
      tags: [company]
      summary: Get this company's own profile
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    put:
      operationId: updateCompanyProfile
      tags: [company]
      summary: Update company profile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompanyProfileInput"
      responses:
        "200":
          description: Updated profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company/dashboard:
    get:
      operationId: getCompanyDashboard
      tags: [company]
      summary: Company dashboard summary stats
      responses:
        "200":
          description: Dashboard summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyDashboard"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company/jobs:
    get:
      operationId: getCompanyJobs
      tags: [company]
      summary: List all jobs posted by this company
      responses:
        "200":
          description: List of company jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobWithApplicantCount"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /company/jobs/{jobId}/applicants:
    get:
      operationId: getJobApplicants
      tags: [company]
      summary: List all applicants for a specific job (company only)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: List of applicants
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ApplicationWithSeeker"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs:
    get:
      operationId: listJobs
      tags: [jobs]
      summary: Browse and search open jobs (public)
      parameters:
        - name: keyword
          in: query
          schema:
            type: string
        - name: location
          in: query
          schema:
            type: string
        - name: job_type
          in: query
          schema:
            type: string
            enum: [Full-time, Part-time, Contract, Internship]
        - name: work_mode
          in: query
          schema:
            type: string
            enum: [On-site, Remote, Hybrid]
        - name: experience_level
          in: query
          schema:
            type: string
            enum: ["Entry / Student", Mid, Senior]
      responses:
        "200":
          description: List of jobs
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/JobCard"

    post:
      operationId: createJob
      tags: [jobs]
      summary: Post a new job (company only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobInput"
      responses:
        "201":
          description: Job created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a company
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}:
    get:
      operationId: getJob
      tags: [jobs]
      summary: Get full job details (public)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Job details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JobDetail"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

    patch:
      operationId: updateJob
      tags: [jobs]
      summary: Update or close a job (company only)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/JobUpdate"
      responses:
        "200":
          description: Updated job
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Job"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /jobs/{jobId}/apply:
    post:
      operationId: applyToJob
      tags: [applications]
      summary: Apply to a job (seeker only)
      parameters:
        - name: jobId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application submitted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "400":
          description: Already applied or invalid
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not a seeker
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Job not found or closed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /applications/{applicationId}/status:
    patch:
      operationId: updateApplicationStatus
      tags: [applications]
      summary: Update application status (company only)
      parameters:
        - name: applicationId
          in: path
          required: true
          schema:
            type: number
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationStatusUpdate"
      responses:
        "200":
          description: Updated application
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Not authorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Application not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /stats:
    get:
      operationId: getPlatformStats
      tags: [stats]
      summary: Get public platform statistics
      responses:
        "200":
          description: Platform stats
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformStats"

  /companies/{companyUserId}/profile:
    get:
      operationId: getPublicCompanyProfile
      tags: [company]
      summary: Get a company's public profile (for job detail views)
      parameters:
        - name: companyUserId
          in: path
          required: true
          schema:
            type: number
      responses:
        "200":
          description: Company profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompanyProfile"
        "404":
          description: Company not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      required: [status]
      properties:
        status:
          type: string

    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string

    # Auth schemas
    SignupInput:
      type: object
      required: [email, password, role]
      properties:
        email:
          type: string
        password:
          type: string
          minLength: 6
        role:
          type: string
          enum: [seeker, company]
        full_name:
          type: ["string", "null"]
        headline:
          type: ["string", "null"]
        company_name:
          type: ["string", "null"]
        industry:
          type: ["string", "null"]

    LoginInput:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
        password:
          type: string

    User:
      type: object
      required: [id, email, role, created_at]
      properties:
        id:
          type: number
        email:
          type: string
        role:
          type: string
          enum: [seeker, company]
        created_at:
          type: string

    AuthResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"

    # Seeker schemas
    EducationEntry:
      type: object
      required: [school, degree, field, start_year]
      properties:
        id:
          type: ["string", "null"]
        school:
          type: string
        degree:
          type: string
        field:
          type: string
        start_year:
          type: number
        end_year:
          type: ["number", "null"]

    ExperienceEntry:
      type: object
      required: [company_name, title, start_date]
      properties:
        id:
          type: ["string", "null"]
        company_name:
          type: string
        title:
          type: string
        start_date:
          type: string
        end_date:
          type: ["string", "null"]
        description:
          type: ["string", "null"]

    SeekerProfile:
      type: object
      required: [user_id, full_name, skills, education, experience]
      properties:
        user_id:
          type: number
        full_name:
          type: string
        headline:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        education:
          type: array
          items:
            $ref: "#/components/schemas/EducationEntry"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceEntry"
        resume_url:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        portfolio_url:
          type: ["string", "null"]
        profile_completeness:
          type: number

    SeekerProfileInput:
      type: object
      properties:
        full_name:
          type: string
        headline:
          type: ["string", "null"]
        location:
          type: ["string", "null"]
        phone:
          type: ["string", "null"]
        bio:
          type: ["string", "null"]
        skills:
          type: array
          items:
            type: string
        education:
          type: array
          items:
            $ref: "#/components/schemas/EducationEntry"
        experience:
          type: array
          items:
            $ref: "#/components/schemas/ExperienceEntry"
        resume_url:
          type: ["string", "null"]
        linkedin_url:
          type: ["string", "null"]
        portfolio_url:
          type: ["string", "null"]

    SeekerDashboard:
      type: object
      required: [applications_submitted, under_review, shortlisted, profile_completeness, recent_activity]
      properties:
        applications_submitted:
          type: number
        under_review:
          type: number
        shortlisted:
          type: number
        profile_completeness:
          type: number
        recent_activity:
          type: array
          items:
            $ref: "#/components/schemas/ActivityItem"

    ActivityItem:
      type: object
      required: [application_id, job_title, company_name, status, updated_at]
      properties:
        application_id:
          type: number
        job_title:
          type: string
        company_name:
          type: string
        status:
          type: string
          enum: [submitted, under_review, shortlisted, rejected, hired]
        updated_at:
          type: string

    # Company schemas
    CompanyProfile:
      type: object
      required: [user_id, company_name, industry, company_size, location]
      properties:
        user_id:
          type: number
        company_name:
          type: string
        logo_url:
          type: ["string", "null"]
        industry:
          type: string
        company_size:
          type: string
          enum: ["1-10", "11-50", "51-200", "201-1000", "1000+"]
        website_url:
          type: ["string", "null"]
        about:
          type: ["string", "null"]
        location:
          type: string

    CompanyProfileInput:
      type: object
      properties:
        company_name:
          type: string
        logo_url:
          type: ["string", "null"]
        industry:
          type: string
        company_size:
          type: string
          enum: ["1-10", "11-50", "51-200", "201-1000", "1000+"]
        website_url:
          type: ["string", "null"]
        about:
          type: ["string", "null"]
        location:
          type: string

    CompanyDashboard:
      type: object
      required: [active_postings, total_applicants, awaiting_review]
      properties:
        active_postings:
          type: number
        total_applicants:
          type: number
        awaiting_review:
          type: number

    # Job schemas
    Job:
      type: object
      required: [id, posted_by, title, description, location, work_mode, job_type, experience_level, status, created_at]
      properties:
        id:
          type: number
        posted_by:
          type: number
        title:
          type: string
        description:
          type: string
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        salary_min:
          type: ["number", "null"]
        salary_max:
          type: ["number", "null"]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]
        status:
          type: string
          enum: [open, closed]
        created_at:
          type: string

    JobCard:
      type: object
      required: [id, title, company_name, location, work_mode, job_type, experience_level, status, created_at, posted_by]
      properties:
        id:
          type: number
        title:
          type: string
        company_name:
          type: string
        company_logo_url:
          type: ["string", "null"]
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]
        salary_min:
          type: ["number", "null"]
        salary_max:
          type: ["number", "null"]
        status:
          type: string
          enum: [open, closed]
        created_at:
          type: string
        posted_by:
          type: number
        has_applied:
          type: ["boolean", "null"]

    JobDetail:
      type: object
      required: [id, title, description, location, work_mode, job_type, experience_level, status, created_at, posted_by, company]
      properties:
        id:
          type: number
        title:
          type: string
        description:
          type: string
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        salary_min:
          type: ["number", "null"]
        salary_max:
          type: ["number", "null"]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]
        status:
          type: string
          enum: [open, closed]
        created_at:
          type: string
        posted_by:
          type: number
        has_applied:
          type: ["boolean", "null"]
        company:
          $ref: "#/components/schemas/CompanyProfile"

    JobWithApplicantCount:
      type: object
      required: [id, title, location, work_mode, job_type, experience_level, status, created_at, applicant_count, posted_by]
      properties:
        id:
          type: number
        title:
          type: string
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]
        status:
          type: string
          enum: [open, closed]
        created_at:
          type: string
        applicant_count:
          type: number
        posted_by:
          type: number

    JobInput:
      type: object
      required: [title, description, location, work_mode, job_type, experience_level]
      properties:
        title:
          type: string
        description:
          type: string
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        salary_min:
          type: ["number", "null"]
        salary_max:
          type: ["number", "null"]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]

    JobUpdate:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        responsibilities:
          type: ["string", "null"]
        requirements:
          type: ["string", "null"]
        location:
          type: string
        work_mode:
          type: string
          enum: [On-site, Remote, Hybrid]
        job_type:
          type: string
          enum: [Full-time, Part-time, Contract, Internship]
        salary_min:
          type: ["number", "null"]
        salary_max:
          type: ["number", "null"]
        experience_level:
          type: string
          enum: ["Entry / Student", Mid, Senior]
        status:
          type: string
          enum: [open, closed]

    # Application schemas
    Application:
      type: object
      required: [id, job_id, applicant_id, status, created_at]
      properties:
        id:
          type: number
        job_id:
          type: number
        applicant_id:
          type: number
        cover_note:
          type: ["string", "null"]
        resume_url:
          type: ["string", "null"]
        status:
          type: string
          enum: [submitted, under_review, shortlisted, rejected, hired]
        created_at:
          type: string

